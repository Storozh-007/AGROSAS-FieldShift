[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "fieldshift-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "geoalchemy2>=0.16,<1", "httpx>=0.28,<1", "shapely>=2.0,<3", "pyproj>=3.7,<4", "numpy>=2.1,<3", "pandas>=2.2,<3", "rasterio>=1.4,<2", "pillow>=11,<13", "anthropic>=1.17,<2"]
[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "respx>=0.22,<1"]
earth = ["geopandas>=1.0", "rasterio>=1.4", "xarray>=2024.10"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
[tool.setuptools.package-data]
app = ["data/*.json", "data/*.geojson", "data/*.tle"]
